name: Validate and build
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked frontend dependencies
        run: cd web && npm ci --ignore-scripts
      - name: Check source privacy
        run: python3 scripts/check-public-source.py
      - name: Test publication privacy regressions
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Test monitor offline
        run: python3 -m unittest discover -s monitor -p 'test_*.py' -v
      - name: Test frontend and build embedded UI
        run: cd web && npm test && npm run build
      - name: Copy embedded UI
        run: cp web/dist/index.html internal/plugin/web/dist/index.html
      - name: Test Go code
        run: go test ./... && go test -race ./... && go vet ./...
      - name: Audit locked frontend dependencies
        run: cd web && npm audit --audit-level=low
      - name: Validate built UI privacy
        run: python3 scripts/check-public-source.py
  build:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: make build-linux-${{ matrix.arch }}
      - name: Upload manual build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpa-key-policy-linux-${{ matrix.arch }}
          path: dist/*.so
          retention-days: 7
